# ============================================================================
# Meta-Philosophy — Core Concepts & Relations
# Maps the philosophical taxonomy to concrete system components
# ============================================================================

version: "1.0"

# ============================================================================
# BRANCHES OF META-PHILOSOPHY
# ============================================================================
branches:
  ontology:
    definition: "The study of what exists within the system and what its nature is"
    key_questions:
      - "What entities exist in our world model? (robot, opponent, arena, rules)"
      - "What is the nature of a 'win'? Is it a score, a state, or a trajectory?"
      - "Do trained models have 'existence' independent of their weights?"
    system_components:
      - "core/meta_objects/ — entity models"
      - "obs_action_config.yaml — world state representation"

  epistemology:
    definition: "The study of how the system knows what it claims to know"
    key_questions:
      - "How reliable is each sensor? How do we know?"
      - "When the shadow loop disagrees with the primary model, how do we resolve truth?"
      - "Can we quantify the uncertainty in every prediction?"
    system_components:
      - "shadow_loop — competing truth claims"
      - "sensor trust bank — reliability calibration"
      - "entropy.log — knowledge evolution trace"

  axiology:
    definition: "The study of values and what the system considers good or right"
    key_questions:
      - "Is maximizing win rate always 'good'?"
      - "How do we trade off speed vs safety vs explainability?"
      - "What makes one strategy 'better' than another?"
    system_components:
      - "existence_declaration.yaml — immutable axioms"
      - "golden_evaluation.yaml — evaluation criteria"
      - "constitution.yaml — team governance values"

  methodology:
    definition: "The study of how the system improves itself"
    key_questions:
      - "What is the best way to learn from failure?"
      - "When should we explore vs exploit?"
      - "How do we know we're improving and not just oscillating?"
    system_components:
      - "MetaHarnessAdapter — iterative improvement engine"
      - "Shadow Loop — A/B testing methodology"
      - "MetaEvolutionHealth — improvement trajectory audit"

# ============================================================================
# DIALECTIC POSITIONS
# For use in CHAL-style multi-agent philosophical debates
# ============================================================================
dialectic_positions:
  empiricist:
    stance: "Truth comes from data. Only what can be measured is real."
    motto: "Show me the numbers."
    strengths: ["Data-driven", "Falsifiable", "Objective"]
    weaknesses: ["Blind to unmeasurable phenomena", "Slow to generalize"]
    agent_profile: "skeptical_scientist"

  rationalist:
    stance: "Truth comes from logic. First principles beat raw data."
    motto: "Reason before measurement."
    strengths: ["Generalizes well", "Finds root causes", "Elegant"]
    weaknesses: ["Can drift from reality", "Assumes correct axioms"]
    agent_profile: "first_principles_engineer"

  pragmatist:
    stance: "Truth is what works. If it improves win rate, it's correct."
    motto: "Does it push the bottle?"
    strengths: ["Action-oriented", "Fast iteration", "Results-focused"]
    weaknesses: ["Short-term thinking", "Ignores deeper meaning"]
    agent_profile: "result_driven_optimizer"

  skeptic:
    stance: "All knowledge is uncertain. Question everything."
    motto: "Are you sure?"
    strengths: ["Catches errors", "Prevents overconfidence", "Robust"]
    weaknesses: ["Analysis paralysis", "Slows progress"]
    agent_profile: "rigorous_reviewer"

  synthesist:
    stance: "Truth emerges from integrating multiple perspectives."
    motto: "The whole is more than the sum."
    strengths: ["Holistic", "Balanced", "Adaptive"]
    weaknesses: ["Can be indecisive", "Hard to formalize"]
    agent_profile: "meta_arbitrator"

# ============================================================================
# COGNITIVE BIASES TO GUARD AGAINST
# ============================================================================
cognitive_biases:
  confirmation_bias:
    description: "Favoring evidence that confirms existing strategies"
    detection: "3+ consecutive same-type acceptances without exploration"
    mitigation: "Force 20% exploration budget"

  anchoring_bias:
    description: "Over-reliance on the first strategy found"
    detection: "New strategies within 10% of baseline deviation"
    mitigation: "Meta-Decision audit triggers diversity injection"

  recency_bias:
    description: "Over-weighting recent results vs long-term trends"
    detection: "Short-term WR spike overrides long-term stable strategy"
    mitigation: "3-round confirmation gate before promotion"

  overconfidence:
    description: "Excessive certainty in model predictions"
    detection: "High confidence but low actual WR"
    mitigation: "Confidence calibration via shadow loop comparison"

  groupthink:
    description: "Multiple agents converging on same suboptimal strategy"
    detection: "Strategy diversity < 0.3 (Meta-Swarm audit)"
    mitigation: "Inject adversarial strategies into candidate pool"

# ============================================================================
# PHILOSOPHICAL AUDIT CHECKLIST
# Used by weekly MetaPhilosophy audit
# ============================================================================
audit_checklist:
  - id: "ONT-001"
    question: "Does the system still know its core purpose?"
    check: "Compare recent decisions against existence_declaration.yaml purpose"
    frequency: "weekly"

  - id: "EPI-001"
    question: "Are knowledge sources still reliable?"
    check: "Cross-validate sensor trust scores against actual accuracy"
    frequency: "weekly"

  - id: "AXI-001"
    question: "Have any immutable axioms been violated?"
    check: "Scan entropy.log for safety/budget/irreversibility violations"
    frequency: "daily"

  - id: "MET-001"
    question: "Is the improvement methodology itself improving?"
    check: "Track MetaEvolutionHealth trend over 4 weeks"
    frequency: "monthly"

  - id: "SEL-001"
    question: "Is the existence declaration itself consistent?"
    check: "Self-referential consistency: do axioms contradict each other?"
    frequency: "monthly"
