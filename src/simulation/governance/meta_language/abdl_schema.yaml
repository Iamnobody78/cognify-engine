# ============================================================================
# ABDL Schema v1.0 — Agent Behavior Description Language
# ============================================================================
# This is the FORMAL DEFINITION of the ABDL language itself.
# system_rules.abdl is written IN this language.
# The abdl_engine.py loads, validates, evaluates, and compiles ABDL rules.
# ============================================================================

version: "1.0"
ratified: "2026-08-01"

# ============================================================================
# LANGUAGE METADATA
# ============================================================================
language:
  name: "Agent Behavior Description Language"
  acronym: "ABDL"
  paradigm: "declarative"
  surface_syntax: "YAML"
  self_describing: true  # This schema is itself an ABDL document

# ============================================================================
# RULE HIERARCHY (Kelsen-style)
# ============================================================================
rule_hierarchy:
  - level: 0
    name: "IMMUTABLE_AXIOMS"
    description: "Cannot be modified without human confirmation + 3 cosigners"
    modify_permission: "human_required"
    source: "existence_declaration.yaml > axiology.immutable_axioms"

  - level: 1
    name: "CONSTITUTIONAL_RULES"
    description: "Core governance rules; modifiable via MetaEvolution + human review"
    modify_permission: "meta_audit_then_human"
    source: "team_constitution.yaml > principles"

  - level: 2
    name: "OPERATIONAL_RULES"
    description: "Day-to-day decision rules; modifiable via Shadow Loop + 3-round gate"
    modify_permission: "shadow_loop_3_rounds"
    source: "meta_rules.json + core_instruction.md"

  - level: 3
    name: "HEURISTIC_RULES"
    description: "Tactical optimization rules; auto-evolve with Pareto frontier check"
    modify_permission: "auto_with_pareto_gate"
    source: "harness_candidates.json + shadow_loop"

# ============================================================================
# RULE STRUCTURE (what every rule must have)
# ============================================================================
rule_structure:
  required_fields:
    - id          # string: unique identifier
    - level       # int: 0=IMMUTABLE, 1=CONSTITUTIONAL, 2=OPERATIONAL, 3=HEURISTIC
    - condition   # string: ABDL condition expression
    - action      # string: ABDL action expression
    - priority    # int: 1-1000 (higher = more urgent)

  optional_fields:
    - description   # string: human-readable explanation
    - context       # string: domain/scope (e.g., "edge_detection", "budget_control")
    - source        # string: where this rule originated
    - depends_on    # list[string]: rule IDs this rule depends on
    - conflicts_with  # list[string]: rule IDs this rule conflicts with
    - confidence    # float: 0-1, how certain the system is about this rule
    - evidence      # string: data/log that supports this rule

# ============================================================================
# CONDITION EXPRESSION GRAMMAR
# ============================================================================
condition_grammar:
  # ABDL conditions use a simple prefix/predicate notation
  # Operators: AND, OR, NOT, >, <, >=, <=, ==, !=, IN, BETWEEN, EXISTS
  # Functions: sensor(NAME), metric(NAME), state(NAME), config(NAME)

  examples:
    - "sensor(min_edge) < 0.25"                              # sensor comparison
    - "AND(sensor(edge_left) < 0.25, sensor(edge_right) < 0.25)"  # combined
    - "NOT(state(emergency_stop))"                            # negation
    - "metric(win_rate) < 0.3 AND config(budget_remaining) > 0"  # multi-domain
    - "BETWEEN(sensor(confidence), 0.4, 0.7)"                # range check
    - "EXISTS(rule('SAFETY-001'))"                            # rule existence check
    - "state(last_action) == 'avoidance'"                     # state check
    - "config(daily_cost) > config(budget_limit)"             # config comparison

  functions:
    sensor: "Read a sensor value by name"
    metric: "Read a system metric by name"
    state: "Read internal state by name"
    config: "Read configuration value by name"
    EXISTS: "Check if an entity exists"

  operators:
    AND: "All sub-conditions must be true"
    OR: "At least one sub-condition must be true"
    NOT: "Condition must be false"
    BETWEEN: "Value must be in range [min, max]"

# ============================================================================
# ACTION EXPRESSION GRAMMAR
# ============================================================================
action_grammar:
  examples:
    - "EXECUTE(avoidance)"                                   # call a function
    - "ALERT(CRITICAL, 'edge_too_close')"                    # raise alert
    - "ESCALATE(hermes_leader)"                              # escalate to agent
    - "LOG('edge_avoidance_triggered')"                      # log event
    - "MODIFY(rule 'SPEED-001', speed=0.5)"                  # modify another rule
    - "REQUEST_HUMAN('Confirm avoidance strategy change')"   # human input
    - "BLOCK(candidate 'C-042')"                             # block a proposal
    - "PROMOTE(rule 'R-007')"                                # promote to higher level
    - "DEPLOY(patch 'hotfix-003')"                           # deploy a patch
    - "CHECKPOINT('before_rule_change')"                     # create git snapshot

  functions:
    EXECUTE: "Execute a named function/strategy"
    ALERT: "Raise an alert with level and category"
    ESCALATE: "Escalate to a named agent"
    LOG: "Write to entropy log"
    MODIFY: "Modify a rule's parameters"
    REQUEST_HUMAN: "Request human operator input"
    BLOCK: "Block a proposal/candidate"
    PROMOTE: "Promote a rule or candidate"
    DEPLOY: "Deploy a code patch"
    CHECKPOINT: "Create a recoverable state snapshot"

# ============================================================================
# VALIDATION RULES (self-referential)
# ============================================================================
validation:
  - rule: "No two rules at LEVEL_0 can conflict"
  - rule: "No rule at LEVEL_2+ can override a LEVEL_0 rule"
  - rule: "All MODIFY actions on LEVEL_0 rules require REQUEST_HUMAN first"
  - rule: "Any rule with confidence < 0.5 must have a fallback action"
  - rule: "Rule IDs must be unique across all levels"
