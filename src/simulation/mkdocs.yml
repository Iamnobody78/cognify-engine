site_name: BottleSumo 旗舰版
site_description: 140GB 物理仿真 + AI 治理旗舰仓库 — Governance Center Dashboard
repo_url: https://github.com/Iamnobody78/bottlesumo-pi
site_url: https://iamnobody78.github.io/bottlesumo-pi/

theme:
  name: material
  language: zh
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

nav:
  - 首页: index.md
  - 架构: architecture.md
  - 架构文档:
    - 架构总纲: architecture_overview.md
    - 生产化路线图: architecture/ROADMAP_PRODUCTION.md
    - 架构演进路线: architecture/ROADMAP_v2.md
    - 数据库设计: architecture/database.md
    - 可观测性: architecture/observability.md
    - 部署指南: architecture/deployment.md
    - 认证与授权: architecture/authz.md
  - 治理: governance.md
  - 审计记录:
    - 审计队列 S4 关账: audits/audit_queue4_closeout.md
  - 工程记录:
    - 治理审计 20260807: engineering/governance_audit_20260807.md
    - Nano 系列关账: engineering/nano_series_closeout_20260809.md
    - P1L2 环境引导证据: engineering/p1l2_env_bootstrap_evidence_20260807.md
    - 性能基线 20260807: engineering/performance_baseline_20260807.md
    - S11 MCP 集成证据: engineering/s11_mcp_integration_evidence_20260807.md
    - S13 MCP 采用证据: engineering/s13_mcp_adoption_evidence_20260807.md
    - S17 评估器差异测试: engineering/s17_evaluator_diff_test_evidence_20260808.md
    - S18 S26 跨域证据: engineering/s18_s26_cross_domain_evidence_20260808.md
    - S20 P1 恒假证据: engineering/s20_p1_always_false_evidence_20260808.md
    - S20 P2 蒸馏设计: engineering/s20_p2_distill_design_20260808.md
    - S20 P2 蒸馏证据: engineering/s20_p2_distill_evidence_20260808.md
    - S27 架构优化证据: engineering/s27_architecture_optimization_evidence_20260808.md
    - S28 速度增益证据: engineering/s28_speed_gain_evidence_20260808.md
    - S29 规则拓扑证据: engineering/s29_rule_topology_evidence_20260808.md
    - S30 M2 四通道证据: engineering/s30_m2_four_channel_evidence_20260808.md
