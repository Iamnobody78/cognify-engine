    - S32 覆盖蒸馏证据: engineering/s32_coverage_distill_evidence_20260808.md
    - S33 候选 G 蒸馏证据: engineering/s33_candidate_g_distill_evidence_20260808.md
    - S34 规则剪枝证据: engineering/s34_rule_prune_distill_evidence_20260808.md
    - S35 符号验证证据: engineering/s35_symbolic_verify_evidence_20260808.md
    - S36 RL 基础设施证据: engineering/s36_rl_infra_evidence_20260808.md
    - S37 观测升级证据: engineering/s37_obs_upgrade_evidence_20260808.md
    - S51 GICI 原生路径否决: engineering/s51_gici_native_path_veto.md
  - MSAN 研究记录:
    - 数据集下载指南: msan/msan_dataset_download_guide.md
    - 评估规范 v1: msan/msan_evaluation_spec_v1.md
    - 初步调研: msan/msan_initial_survey.md
    - 研究方法: msan/research_methods.md
    - S48 T1 Oxford 格式报告: msan/s48_t1_oxford_format_report.md
    - S50 研究方法: msan/s50_research_methods.md
    - S51 批统计报告: msan/s51_batch_stats_report.md
    - S52 判据回测: msan/s52_criteria_backtest.md
    - S52 评估判据 v2: msan/s52_evaluation_criteria_v2.md
    - S53 1117 退化报告: msan/s53_1117_degradation_report.md
    - S54 位置优化: msan/s54_position_opt.md
    - S55 位置判据: msan/s55_position_criteria.md
    - S56 偏差处理: msan/s56_bias_handling.md
    - S58 F2 质量自适应: msan/s58_f2_quality_adaptive.md
  - 产品化:
    - Dashboard 规格: productization/dashboard_spec.md
    - ROS 2 集成协议: productization/ros_integrate_protocol_v1.md
    - ROS 2 集成 ROUND 0 报告: productization/ros_int_round0_report.md
  - Sprint 队列:
    - 队列 5 清单: sprints/queue5_manifest.md
  - 开发: contributing.md
  - 变更: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

extra:
  generator: false
