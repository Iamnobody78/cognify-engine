# ===== bottlesumo-pi 治理中心 — 生产 TLS 部署 (S6) =====
# 在基础 compose 之上叠加 TLS 终止层:
#   docker compose -f docker-compose.yml -f deployment/docker-compose.tls.yml up --build -d
#
# 前置: 先生成证书 (任选其一)
#   自签/内部: bash deployment/gen_self_signed_cert.sh
#   公网:     certbot certonly --standalone -d your.domain  后将证书复制到 deployment/certs/
#
# 覆盖内容:
#   - frontend: 挂载 TLS nginx 配置 + 证书卷, 暴露 443/80
#   - backend:  注入 GOV_AUTH_SECRET (生产密钥, 必须覆盖)
#   - 全部服务: 生产日志/重启策略已在基础 compose 定义, 此处仅安全增量

services:
  backend:
    environment:
      # 生产安全: 必须覆盖默认 DEV_SECRET (auth.py 启动时对 DEV_SECRET 告警)
      GOV_AUTH_SECRET: ${GOV_AUTH_SECRET:?请设置生产 GOV_AUTH_SECRET (openssl rand -hex 32)}
      # 生产 CORS/代理信任: uvicorn 位于 TLS 代理之后
      GOV_TRUST_PROXY_HEADERS: "true"
    ports: !reset []            # 生产不直接暴露 8000, 仅经 TLS 代理
    expose:
      - "8000"

  frontend:
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deployment/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro
