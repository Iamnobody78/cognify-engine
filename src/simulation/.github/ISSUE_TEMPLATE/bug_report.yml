name: 🐛 Bug Report
description: 报告旗舰主体 / Dashboard / 治理集成缺陷
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **感谢报告！** 治理绕过/谎报漏洞**不要**在此提交——见 SECURITY.md。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？
      description: 实际行为 vs 预期行为
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: 涉及组件
      description: dashboard-backend / dashboard-frontend / firmware / simulation / rl / core / governance-engine
      placeholder: "dashboard-backend"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      render: python
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 环境
      description: OS / WSL / Python / Node / 仿真后端
    validations:
      required: false
