name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 主仓库轻量测试（纯 Python，无 140GB 仿真依赖）────────────────
  core-tests:
    name: Core lightweight tests (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          pip install --upgrade pip
          pip install pytest numpy gymnasium pyyaml
      - name: Run lightweight core tests
        run: |
          python -m pytest tests/test_lightweight_env.py tests/test_heuristic_rules.py -q

  # ─── Dashboard 后端（治理引擎验证）────────────────────────────────
  dashboard-backend:
    name: Dashboard backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bottlesumo-pi
      - uses: actions/checkout@v4
        with:
          repository: Iamnobody78/agent-governance-v2
          path: agent-governance-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend + engine deps
        run: |
          pip install --upgrade pip
          pip install -r bottlesumo-pi/dashboard/backend/requirements.txt
          pip install -r agent-governance-v2/requirements.txt
      - name: Run dashboard backend tests (with coverage gate)
        working-directory: bottlesumo-pi/dashboard/backend
        run: |
          python -m pytest tests -q --no-header \
            --cov=. --cov-report=term --cov-fail-under=90
      - name: Run governance engine tests
        working-directory: agent-governance-v2
        run: |
          python -m pytest tests/ -q --no-header -k "protocol or verification or mce or vce or governance"

  # ─── Dashboard 后端 (PostgreSQL 模式, GAP-2.1) ──────────────────────
  dashboard-backend-pg:
    name: Dashboard backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bottlesumo
          POSTGRES_PASSWORD: bottlesumo
          POSTGRES_DB: bottlesumo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bottlesumo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: bottlesumo-pi
      - uses: actions/checkout@v4
        with:
          repository: Iamnobody78/agent-governance-v2
          path: agent-governance-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend + engine deps
        run: |
          pip install --upgrade pip
          pip install -r bottlesumo-pi/dashboard/backend/requirements.txt
          pip install -r agent-governance-v2/requirements.txt
      - name: Run dashboard backend tests (PostgreSQL)
        working-directory: bottlesumo-pi/dashboard/backend
        env:
          GOV_DASH_DB_URL: postgresql+psycopg://bottlesumo:bottlesumo@localhost:5432/bottlesumo_test
        run: |
          python -m pytest tests -q --no-header

  # ─── Dashboard 前端构建 ────────────────────────────────────────────
  dashboard-frontend:
    name: Dashboard frontend (vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build

  # ─── 汇总门 ───────────────────────────────────────────────────────
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [core-tests, dashboard-backend, dashboard-backend-pg, dashboard-frontend]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "core=${{ needs.core-tests.result }}"
          echo "backend=${{ needs.dashboard-backend.result }}"
          echo "backend-pg=${{ needs.dashboard-backend-pg.result }}"
          echo "frontend=${{ needs.dashboard-frontend.result }}"
          if [[ "${{ needs.core-tests.result }}" != "success" || \
                "${{ needs.dashboard-backend.result }}" != "success" || \
                "${{ needs.dashboard-backend-pg.result }}" != "success" || \
                "${{ needs.dashboard-frontend.result }}" != "success" ]]; then
            echo "::error::CI Gate failed"
            exit 1
          fi
          echo "✅ CI Gate passed"
