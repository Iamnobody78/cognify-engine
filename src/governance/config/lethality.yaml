# Ls 权重表 (可解释治理主控 Step 2b, AUDIT-0068)
#
# "策略是数据"铁律: 工具杀伤半径权重从 src/lethality.py 硬编码迁移到此处,
# 策略调整不再需要改代码 — 改 YAML 后经 maybe_reload_lethality() 热重载
# (mtime 检查, 与 policy.py DEBT-0005 同模式), 或重启服务生效。
#
# 语义分档:
#   0.1-0.3  只读/无害 (search, query, read, list, get)
#   0.4-0.6  轻量状态变更 / 未知工具默认 (send, notify, copy, move)
#   0.5-0.7  状态写入 (create, edit, write, update, append)
#   0.8-0.95 系统执行 / 删除 / 提权 (execute_command, rm_*, sudo_*)
#
# 安全约束 (加载时校验, 违者拒绝加载 / 热重载保留旧表):
#   - 缺失 lethality: 顶层映射 → 拒绝 (fail-closed)
#   - 权重值必须是 0.0-1.0 的数字 (bool/字符串/越界 → 拒绝)
#   - 空表 → 拒绝 (与 config/policies.yaml 空规则同哲学)
# 未知工具在代码层取默认 0.6 (中等, 审计语义: 无法评估即按中等记账)。
lethality:
  # ── read-only (0.1-0.3) ──
  search: 0.2
  query: 0.2
  read: 0.2
  read_file: 0.2
  list: 0.2
  get: 0.2
  lookup: 0.2
  retrieve: 0.2
  stat: 0.2
  ls: 0.1
  cat: 0.2
  fetch_url: 0.3
  get_weather: 0.1

  # ── light state change (0.4-0.6) ──
  notify: 0.4
  send_message: 0.5
  email: 0.5
  copy: 0.6
  move: 0.6
  rename: 0.6
  mkdir: 0.5
  upload: 0.7
  http_post: 0.6

  # ── write / state-change (0.5-0.7) ──
  write: 0.7
  write_file: 0.7
  edit: 0.7
  edit_file: 0.7
  create: 0.7
  create_file: 0.7
  append: 0.7
  append_file: 0.7
  update: 0.7
  update_file: 0.7
  overwrite: 0.7
  overwrite_file: 0.7
  patch: 0.7
  apply_patch: 0.7
  config_write: 0.7
  set_env: 0.75
  set_secret: 0.8
  set_permissions: 0.85
  chmod: 0.85

  # ── system execution (0.85-0.95) ──
  execute_command: 0.95
  execute: 0.9
  system_run: 0.95
  shell_exec: 0.95
  run_shell: 0.95
  terminal_exec: 0.95
  bash: 0.95
  sh: 0.95
  subprocess: 0.95
  run: 0.85
  python_exec: 0.9
  exec: 0.9
  eval: 0.9

  # ── deletion / destructive (0.9-0.95) ──
  delete: 0.95
  delete_file: 0.95
  delete_user: 0.95
  delete_all: 0.95
  rm: 0.95
  rm_file: 0.95
  rmdir: 0.9
  drop: 0.95
  drop_table: 0.95
  truncate: 0.95
  format: 0.95

  # ── privilege (0.85-0.95) ──
  sudo_exec: 0.95
  sudo: 0.95
