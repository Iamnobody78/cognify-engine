name: Bug 报告
description: 提交缺陷报告
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢提交 Bug 报告！请尽量提供复现信息。"
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步步如何复现
      placeholder: |
        1. 执行 ...
        2. 观察 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: cognify --version 或 git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/报错
      description: 贴出相关输出
      render: shell
