name: PyPI Release

# 受信任发布者 (Trusted Publisher / OIDC) — 无需 API Token
# 唯一手动步骤 (无法自动化, 外部身份边界):
#   PyPI → cognify-engine 项目设置 → Publishing → 添加受信任发布者:
#     Owner: Iamnobody78 | Repository: cognify-engine | Workflow: release.yml

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC: 项目已存在 (v2.2.3 首发布用 Token), 此后零 Token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # fallback: 若 OIDC 异常, 在 env 设 TWINE_PASSWORD: ${{ secrets.PYPI }}

  github-release:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
