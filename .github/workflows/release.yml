name: PyPI Release

# 受信任发布者 (Trusted Publisher / OIDC) — 无需 API Token
# 唯一手动步骤 (无法自动化, 外部身份边界):
#   PyPI → cognify-engine 项目设置 → Publishing → 添加受信任发布者:
#     Owner: Iamnobody78 | Repository: cognify-engine | Workflow: release.yml

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC: 发布到已存在项目时可用
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        # 首次发布 (项目不存在): PyPI 拒绝 OIDC 创建新项目 ("Non-user identities cannot create new projects")
        # → 使用 Token 路径; 项目存在后可切回 OIDC (pypa/gh-action-pypi-publish@release/v1 无 env)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: pip install twine && twine upload dist/*

  github-release:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
