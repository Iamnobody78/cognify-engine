name: PyPI Release

# 受信任发布者 (Trusted Publisher / OIDC) — 无需 API Token
# 唯一手动步骤 (无法自动化, 外部身份边界):
#   PyPI → cognify-engine 项目设置 → Publishing → 添加受信任发布者:
#     Owner: Iamnobody78 | Repository: cognify-engine | Workflow: release.yml

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC 保留 (受信任发布者配置核对后可用)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        # 2026-08-16 OIDC 实测: "OIDC scoped token is not valid for project" (受信任发布者未正确关联)
        # → 回退 Token 路径 (Secret: PYPI, v2.2.3 已验证); OIDC 配置核对后可切回 gh-action-pypi-publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI }}
        run: twine upload dist/*

  github-release:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
