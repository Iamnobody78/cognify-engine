[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognify-engine"
version = "2.2.3"
description = "认知操作产品 — AI 代理治理与认知操作系统 (插件平台 PLUGINIFY v1.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iamnobody78" }]
keywords = ["agent-governance", "metacognition", "cognitive-os", "vce", "mmce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
cognify = "cognify._cli:main"

[tool.setuptools]
# P0 整改 (元批判): core/ 为运行时依赖入包; cli/plugins 完整打包为 v2.3.0 项
# (cli 为脚本目录, plugins 为嵌套快照 — 打包方案设计中, 当前 wheel 提供库能力 + 诚实降级入口)
packages = ["cognify", "core"]

