[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognify-engine"
version = "2.2.3"
description = "认知操作产品 — AI 代理治理与认知操作系统 (插件平台 PLUGINIFY v1.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iamnobody78" }]
keywords = ["agent-governance", "metacognition", "cognitive-os", "vce", "mmce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
cognify = "cognify._cli:main"

[tool.setuptools]
# v2.3.0 打包: 完整 CLI + 插件入 wheel (库+CLI 全功能)
packages = {find = {include = ["cognify*", "core*", "cli*", "plugins*"]}}
include-package-data = true

