# 统一 MCP 注册表 (UNIFIED MCP REGISTRY) — 书同文车同轨
# 一处配置, 三处使用: Hermes (config.yaml mcp_servers) / AionUi (mcp_servers 表) / DSH (注册表参考)
# status:
#   ready          现网可直接注册 (npx 免安装 / 本地脚本 / 已有凭据)
#   pending-key    需 API 凭据 (请示队列)
#   pending-app    需安装专业软件 (Inventor/ANSYS/LTspice/EPLAN/Blender/Unreal...)
#   pending-hardware 需物理硬件 (摄像头/机器人/机械臂)
#   registry-only  生态候选 (待评估安装路径)
