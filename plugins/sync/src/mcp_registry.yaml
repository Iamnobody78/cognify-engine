  - id: sqlite
    name: SQLite
    domain: 数据库
    status: ready
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sqlite", "C:/Users/ivy/.aionui-tri-sync/state/unified.db"]
    systems: [hermes, aionui]
  - id: playwright
    name: Playwright
    domain: 浏览器自动化
    status: ready
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest"]
    systems: [hermes, aionui]
  - id: chrome-devtools
    name: Chrome DevTools
    domain: 浏览器自动化
    status: ready
    transport: stdio
    command: npx
    args: ["-y", "chrome-devtools-mcp@latest"]
    systems: [hermes, aionui]
  - id: cognify
    name: Cognify Engine
    domain: 认知操作
    status: ready
    transport: stdio
    command: "C:/Users/ivy/AppData/Local/Programs/Python/Python312/python.exe"
    args: ["C:/Users/ivy/AppData/Roaming/AionUi/aionui/conversations/2026/07/27/aionrs-temp-48324704/cognify-engine/mcp/cognify_mcp_server.py"]
    systems: [hermes, aionui, dsh]

