# ============================================================
# TRI-SYNC-DAEMON v1.0 配置 — Hermes / AionUi / DSH 三方同步
# 生成: 2026-08-14 (基于真实路径侦察, 非模板占位)
# ============================================================

sync:
  mode: tri-directional
  interval: 30            # 秒, 空闲轮询频率
  conflict_resolution: timestamp   # timestamp | priority | manual
  sync_on_change: true
  heartbeat_ttl: 120      # 秒, 超过此时间未心跳视为离线
  max_file_mb: 10         # 镜像时跳过超过此大小的单文件 (大文件只做元数据记录)
  workspace: "C:\\Users\\ivy\\AppData\\Roaming\\AionUi\\aionui\\conversations\\2026\\07\\27\\aionrs-temp-48324704"

sources:
  aionui:
    label: AionUi
    role: backup          # 备胎: 界面与调度层
    root: "C:\\Users\\ivy\\AppData\\Roaming\\AionUi\\aionui"
    db: "C:\\Users\\ivy\\AppData\\Roaming\\AionUi\\aionui\\aionui-backend.db"
    conversations: "C:\\Users\\ivy\\AppData\\Roaming\\AionUi\\aionui\\conversations"
    memory_store: "C:\\Users\\ivy\\AppData\\Roaming\\AionUi\\memory_store"
    meta_prompts: "C:\\Users\\ivy\\.aionui\\meta_prompts"
    mcp_servers_json: "C:\\Users\\ivy\\AppData\\Roaming\\AionUi\\.aionui\\mcp\\servers.json"
    tools_mcp_yaml: "C:\\Users\\ivy\\.aionui\\tools\\mcp_servers.yaml"
  hermes:
    label: Hermes
    role: governance      # 治理: 记忆/会话/ACP 适配
    root: "C:\\Users\\ivy\\AppData\\Local\\hermes"
    memories: "C:\\Users\\ivy\\AppData\\Local\\hermes\\memories"
    config: "C:\\Users\\ivy\\AppData\\Local\\hermes\\config.yaml"
    state_db: "C:\\Users\\ivy\\AppData\\Local\\hermes\\state.db"
    memory_store_db: "C:\\Users\\ivy\\AppData\\Local\\hermes\\memory_store.db"
  dsh:
    label: DSH
    role: engine          # 主引擎: 执行/会话事件流
    root: "C:\\Users\\ivy\\.dsh"
    sessions: "C:\\Users\\ivy\\.dsh\\sessions"
    storages: "C:\\Users\\ivy\\.dsh\\storages"
    settings: "C:\\Users\\ivy\\.dsh\\settings.yaml"
    workspace_json: "C:\\Users\\ivy\\.dsh\\storages\\workspace.json"
    registry: "C:\\Users\\ivy\\.dsh\\storages\\aionui-sync"
    profiles: "C:\\Users\\ivy\\.dsh\\profiles"

authority:
  memory: hermes          # Hermes 是记忆权威 (单向分发)
  config: dsh             # DSH 是配置权威 (settings/workspace.json)
  workspace: aionui       # AionUi 会话目录即共享 cwd (DSH 绑定同轨)
  conversations: timestamp  # 对话目录: 时间戳优先
  sessions: dsh           # DSH 会话事件流: DSH 权威 (只读镜像)

exclude:
  - ".git"
  - "node_modules"
  - "__pycache__"
  - ".pytest_cache"
  - ".cache"
  - "*.pyc"
  - "*.pyo"
  - "*.tmp"
  - "*.lock"
  - "data"                # 工作区大体积数据目录 (3.2GB)
  - "archive"             # 工作区归档目录 (1.8GB)
  - "Cache"
  - "GPUCache"
  - "Code Cache"
  - "Crashpad"
  - "DawnGraphiteCache"
  - "DawnWebGPUCache"

backup:
  enabled: true
  db_interval: 3600       # 秒, aionui-backend.db 快照间隔
  keep: 24                # 保留最近 24 个快照
  conflict_dir: "C:\\Users\\ivy\\.aionui-tri-sync\\backup\\conflicts"

hub:
  root: "C:\\Users\\ivy\\.aionui-tri-sync\\hub"
  logs: "C:\\Users\\ivy\\.aionui-tri-sync\\logs"
  state: "C:\\Users\\ivy\\.aionui-tri-sync\\state"
  queues: "C:\\Users\\ivy\\.aionui-tri-sync\\queues"
