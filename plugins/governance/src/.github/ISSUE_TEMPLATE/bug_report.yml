name: 🐛 Bug Report
description: 报告治理引擎 / Dashboard / 协议编译器的缺陷
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **感谢报告！** 请尽量提供最小复现。涉及治理绕过/谎报漏洞的，**不要**在此提交——见 SECURITY.md。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 实际行为 vs 预期行为
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: 涉及组件
      description: 如 protocol_gateway / mce_introspection / vce_scanner / verification / dashboard-backend / dashboard-frontend
      placeholder: "protocol_gateway"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现（步骤或代码）
      description: 请给出可运行的最小复现。若涉及协议 YAML，请粘贴协议片段。
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含错误输出 / 测试名）
      render: shell
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: 是否为回归？
      options:
        - 不确定
        - 是（此前版本正常）
        - 否（新行为一直如此）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 如 v2.0.0 或 git commit hash
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 相关测试
      description: 与本缺陷最相关的测试文件名（契约参考）
    validations:
      required: false
