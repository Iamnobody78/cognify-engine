name: ✨ Feature Request
description: 提议新能力 / 新协议 / 新验证通道
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **请先阅读 [CONTRIBUTING.md](https://github.com/Iamnobody78/agent-governance-v2/blob/main/CONTRIBUTING.md) 的 8-GATE 流程**——实质变更需先输出方案 + 验收标准（AC1-AC6），经维护者裁决后启动。
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 解决的问题
      description: 这个特性解决什么治理缺口？（如：谎报、盲点、不可审计、性能）
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 建议的实现方案（模块、接口、协议 YAML 形态）
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 建议的验收标准（AC1-AC6）
      description: 可验证的验收标准，如"新增协议后 scanner 输出无冲突"等
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 新协议（11-col-v1 YAML）
        - 新验证通道（DeclarationValidator 实现）
        - 新自省/自审能力（MCE/VCE 扩展）
        - Dashboard 功能
        - 文档 / 治理资产
        - 其他
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 期望优先级
      options:
        - P0（本周）
        - P1（下个 Sprint）
        - P2（规划中）
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 会改动的模块 / 是否违反既有测试契约 / 需要新增的测试
    validations:
      required: false
