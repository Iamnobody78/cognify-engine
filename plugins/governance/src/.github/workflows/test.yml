name: ci-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 显式安装全量依赖 — tree_sitter / tree_sitter_languages 是 AST 语义门
      # 核心依赖 (test_ast_guard*/test_taint/test_policy_engine 收集必需)。
      # 本机环境缺失时会导致收集错误, CI 必须显式安装 (S66 遗留项闭环)。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 测试必须在仓库根目录运行 (config/policies.yaml 相对路径解析)。
      # GitHub Actions 工作目录即仓库根, 满足要求。
      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short

      - name: Run governance suite (S63-S66 CVE-S)
        run: python -m pytest tests/test_protocol_gateway.py tests/test_mce_introspection.py tests/test_vce_scanner.py tests/test_verification.py -q
