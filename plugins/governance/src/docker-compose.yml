# governance-gateway 一键启动 — 网关 + Prometheus + Grafana (阶段 C1)
# 用法: docker compose up --build -d
#   - 网关:  http://localhost:9000/v1/health
#   - 指标:  http://localhost:9000/metrics
#   - Prom:  http://localhost:9090
#   - Grafana: http://localhost:3000 (admin/admin)

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: governance-gateway:stage-c1
    container_name: governance-gateway
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/v1/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - gov-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gov-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - gov-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gov-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - gov-net

volumes:
  prom-data:
  grafana-data:

networks:
  gov-net:
    driver: bridge
