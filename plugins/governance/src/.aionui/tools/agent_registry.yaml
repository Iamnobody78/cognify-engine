# Agent 注册表 — agent-governance 团队制（外环协议）

> 维护者: Coordinator（Meta Harness Proposer / 治理智能体）
> 更新: 2026-08-03（调度层第一阶段）
> 用途: 记录每个 Agent 实例的能力边界、状态、当前会话；路由仲裁依据。

## 本地 Spawn 角色（哑执行者，单次任务生命周期）

| 角色 | 能力边界 | 允许写入 | 只读 | 状态 |
|------|----------|----------|------|------|
| **Builder** 🛠️ | 生成/修改源代码 ≤2 文件/任务；**任务指令必须携带完整 diff/精确锚点（补丁语义），禁止探索式读取** | `src/`, `config/`, `tests/` | — | 可用（SCHED-001/002/003 + REAL-001 验证） |
| **Tester** 🧪 | 按接口契约编写并运行测试 | `tests/` + `work/<TASK>/tester_output.md` | `src/`（只读） | 可用（TASK-SCHED-002 验证，21 用例） |
| **Reviewer** 🔍 | 合并审查多角色产物、独立重跑验证 | 仅 `work/<TASK>/reviewer_verdict.md` | `src/`, `tests/`, `work/` | 可用（v2 先落盘协议验证；002 合并审查验证） |
| **Archivist** 📁 | 更新文档/审计日志 | `*.md`, `.aionui/` | — | 备用（2 代理模式由 Reviewer 兼任） |

