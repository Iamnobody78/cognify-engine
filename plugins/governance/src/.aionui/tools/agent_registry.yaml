## 路由仲裁规则（外环）

1. 任务 ≤2 文件、≤5 维度 → 单 Builder + Reviewer 接力（调度层第一阶段）
2. **任务含"实现 + 测试"双产物 → Builder + Tester 并行（同一 Spawn 调用）+ Reviewer 合并审查（第二阶段）**；双方 prompt 必须携带相同接口契约
3. 任务 >2 文件 → 拆分多任务，每任务独立接力（防撞车：文件分配表）
4. 安全敏感变更 → Reviewer 必须运行真实验证（pytest/AST），禁止口头 PASS
5. 子代理不可互相通信 → 接力永远由 Coordinator 驱动，共享上下文=工作区文件系统
6. 关键产物"先落盘"：verdict/测试文件必须在子代理最早可行阶段写入；Coordinator 每轮验证产物存在+完整，缺失即修复轮（TASK-SCHED-001/002 教训）
7. 并行任务必须共享接口契约（类名/签名/语义/边界），否则产物不匹配

## 沙箱隔离（声明式）

```yaml
# 提议中的沙箱规则（YAML 声明式，待批准）
Builder:
  write: ["src/", "config/", "tests/"]
  deny: [".aionui/decisions/", ".aionui/scheduler/"]
Reviewer:
  write: ["*.verdict.md", ".aionui/scheduler/work/**"]
  deny: ["src/", "tests/", "config/"]
```


## MCP 共享通道（阶段 3，TASK-SCHED-003 验证）

| 项 | 值 |
|----|----|
| 服务器 | `filesystem_mcp_server.py`（BottleSumo 平台 stdio MCP，JSON-RPC 2.0） |
| 客户端 CLI | `scripts/mcp_client.py`（tools / call；`\n` 转义；exit 0/1/2） |
| 沙箱 | `BOTTLESUMO_ROOT`=repo root；路径逃逸拒绝 |
| 工具 | read_file / write_file / list_directory / create_directory / file_info |
| 验证 | TASK-SCHED-003：Builder 写 1479B + Tester 写 3185B + Reviewer 只读 8/8 OK；file_info 全匹配 |

### 通道纪律（8.2，写后审 + 自证）
1. 子代理经 MCP 写入 artifact 后必须立即 `file_info` 自证大小（防截断丢失）
2. Reviewer 只读 MCP（read_file/file_info），禁止原生 Read
3. PowerShell 内容含双引号 → 必须经 Python subprocess 传单 argv（helper 脚本）
4. "声称写入但 Not found"（截断）→ 重建并保留完整命令轨迹

### 路由仲裁规则（新增第 8 条）
8. 任务需工具级共享（Reviewer 读、Builder/Tester 写同一模块）→ 启用 MCP 通道；
   并行写不同文件允许；Reviewer 必须经 MCP 读取并独立重跑

9. 真实任务（>自造任务复杂度）→ Builder 指令必须**补丁语义**：携带完整 diff / 精确锚点（count==1 断言），
   禁止"读全部代码再设计"（TASK-REAL-001: Builder v1 READ 截断 0 writes 教训）
10. 内容含 `\n` 字面量/复杂转义 → 禁用 mcp_client CLI 转义，**JSON-RPC 直写**原始 payload（TASK-REAL-001: f-string 损坏教训）
11. Reviewer verdict 未落盘即截断 → Coordinator **兜底补全落盘**并标注（写后审优先于渠道纯净）
12. 任务规模 >6 锚点或 >1 大文件重写 → **拆分 Spawn**（每次 ≤6 锚点）或 Coordinator 兜底；
   禁止单子代理硬扛大任务（TASK-REAL-002: Builder+Tester 双截断 0 writes 教训）
