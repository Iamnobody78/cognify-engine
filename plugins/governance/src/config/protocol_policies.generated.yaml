name: protocol-gateway
version: 0.1.0
source: compiled from bottlesumo_pi/governance/protocols/schema (S62 A1 protocol compiler)
  via src/protocol_gateway.py
rules:
- name: protocol-entropy_denoise-ethics
  path_pattern: '*'
  action: DENY
  reason: '协议 entropy_denoise 伦理边界被违反: 不曲解原始意图 (violation 声明非空 → DENY)'
  priority: 5
  escalation_timeout: 300
  escalation_channel: slack
  json_path: $.governance.protocols.entropy_denoise.violation
  json_pattern: .+
- name: protocol-feynman_test-ethics
  path_pattern: '*'
  action: DENY
  reason: '协议 feynman_test 伦理边界被违反: 不用于误导性简化 (violation 声明非空 → DENY)'
  priority: 5
  escalation_timeout: 300
  escalation_channel: slack
  json_path: $.governance.protocols.feynman_test.violation
  json_pattern: .+
- name: protocol-logic_chain_check-ethics
  path_pattern: '*'
  action: DENY
  reason: '协议 logic_chain_check 伦理边界被违反: 不攻击人格只检查逻辑 (violation 声明非空 → DENY)'
  priority: 5
  escalation_timeout: 300
  escalation_channel: slack
  json_path: $.governance.protocols.logic_chain_check.violation
  json_pattern: .+
- name: protocol-entropy_denoise-enforce
  path_pattern: '*'
  action: ESCALATE
  reason: '协议 entropy_denoise 已触发 (输入信息熵 > 阈值时); 需满足产出 ''去噪后的要点列表'' 并声明 satisfied=true
    (collab: 请去噪后重述核心意图)'
  priority: 15
  escalation_timeout: 300
  escalation_channel: protocol_gateway
  json_path: $.governance.protocols.entropy_denoise
  json_pattern: (?=.*"triggered":true)(?!.*"satisfied":true)
- name: protocol-feynman_test-enforce
  path_pattern: '*'
  action: ESCALATE
  reason: '协议 feynman_test 已触发 (每次新协议入库时); 需满足产出 ''理解深度评分 ≥ 80%'' 并声明 satisfied=true
    (collab: 请用费曼测试检查我对该协议的理解)'
  priority: 20
  escalation_timeout: 300
  escalation_channel: protocol_gateway
  json_path: $.governance.protocols.feynman_test
  json_pattern: (?=.*"triggered":true)(?!.*"satisfied":true)
- name: protocol-logic_chain_check-enforce
  path_pattern: '*'
  action: ESCALATE
  reason: '协议 logic_chain_check 已触发 (关键决策前); 需满足产出 ''逻辑链完整性报告'' 并声明 satisfied=true
    (collab: 请逐环检查我的推理链)'
  priority: 20
  escalation_timeout: 300
  escalation_channel: protocol_gateway
  json_path: $.governance.protocols.logic_chain_check
  json_pattern: (?=.*"triggered":true)(?!.*"satisfied":true)
- name: protocol-entropy_denoise-ok
  path_pattern: '*'
  action: ALLOW_WITH_WARNING
  reason: '协议 entropy_denoise 已满足: 去噪后的要点列表'
  priority: 25
  escalation_timeout: 300
  escalation_channel: slack
  json_path: $.governance.protocols.entropy_denoise
  json_pattern: (?=.*"satisfied":true)
- name: protocol-feynman_test-ok
  path_pattern: '*'
  action: ALLOW_WITH_WARNING
  reason: '协议 feynman_test 已满足: 理解深度评分 ≥ 80%'
  priority: 30
  escalation_timeout: 300
  escalation_channel: slack
  json_path: $.governance.protocols.feynman_test
  json_pattern: (?=.*"satisfied":true)
- name: protocol-logic_chain_check-ok
  path_pattern: '*'
  action: ALLOW_WITH_WARNING
  reason: '协议 logic_chain_check 已满足: 逻辑链完整性报告'
  priority: 30
  escalation_timeout: 300
  escalation_channel: slack
  json_path: $.governance.protocols.logic_chain_check
  json_pattern: (?=.*"satisfied":true)
