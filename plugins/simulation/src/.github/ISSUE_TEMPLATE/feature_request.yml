name: ✨ Feature Request
description: 提议新能力 / 新策略 / Dashboard 功能
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **请先读 [CONTRIBUTING.md](https://github.com/Iamnobody78/bottlesumo-pi/blob/main/CONTRIBUTING.md) 8-GATE**——实质变更先方案 + 验收标准，经维护者裁决。
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 解决什么治理/工程缺口？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 建议验收标准（AC1-AC6）
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - Dashboard 功能
        - 新策略 / 协议
        - 旗舰主体能力
        - 仿真 / 训练
        - 文档 / 治理资产
        - 其他
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0（本周）
        - P1（下个 Sprint）
        - P2（规划中）
    validations:
      required: true
