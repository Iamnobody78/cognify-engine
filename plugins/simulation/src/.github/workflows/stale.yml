name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: "此 issue 已 60 天无活动，将被标记为 stale。若仍相关请评论更新。"
          close-issue-message: "此 issue 已 stale 14 天，现自动关闭。可重新开启继续讨论。"
          stale-pr-message: "此 PR 已 60 天无活动，将被标记为 stale。请更新并推进合并。"
          close-pr-message: "此 PR 已 stale 14 天，现自动关闭。"
          exempt-issue-labels: "security,epic,P0"
          exempt-pr-labels: "security,dependencies"
