name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build sdist (dashboard backend)
        working-directory: dashboard/backend
        run: |
          pip install build
          python -m build --sdist --outdir ../../dist
      - name: Build frontend asset bundle
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm run build
          tar -czf ../../dist/dashboard-frontend-${{ steps.version.outputs.tag }}.tar.gz -C dist .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BottleSumo ${{ steps.version.outputs.tag }}
          body: |
            ## BottleSumo ${{ steps.version.outputs.tag }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Assets
            - Dashboard backend sdist
            - Dashboard frontend bundle
          draft: false
          prerelease: false
          files: |
            dist/*
