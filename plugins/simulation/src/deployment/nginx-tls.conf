# ===== bottlesumo-pi 治理中心 — 生产 TLS 终止配置 (S6) =====
# 用法: 通过 deployment/docker-compose.tls.yml 挂载本文件覆盖默认配置
#   volumes:
#     - ./deployment/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
#     - ./deployment/certs:/etc/nginx/certs:ro
#
# 证书路径约定: /etc/nginx/certs/bottlesumo.crt + bottlesumo.key
# 证书生成: bash deployment/gen_self_signed_cert.sh   (自签/内部)
#           certbot certonly --nginx -d your.domain    (公网 Let's Encrypt)
#
# 安全基线 (S6):
#   - TLS 1.2/1.3 仅启用, 禁用 SSLv3/TLS1.0/1.1
#   - HSTS (max-age=31536000, includeSubDomains)
#   - HTTP → HTTPS 301 跳转 (HSTS preload 就绪)
#   - 安全响应头: X-Content-Type-Options / X-Frame-Options / CSP

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主服务 (TLS 终止) ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---- TLS 证书 (由 docker-compose.tls.yml 挂载) ----
    ssl_certificate     /etc/nginx/certs/bottlesumo.crt;
    ssl_certificate_key /etc/nginx/certs/bottlesumo.key;

    # ---- TLS 协议与套件 (S6 安全基线) ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 治理 API 反向代理 → backend 服务 (fail-open 保持) ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # v1 版本化 API (A4) 走同一 backend
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Prometheus 指标
    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
