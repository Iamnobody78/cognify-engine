# SYNC-ALL v1.2 同步策略 —— 实际环境路径版
# AionUi ↔ Hermes ↔ DeepSeek Harness 三端统一上下文同步
# 差异修正: 方案假设路径 → 本机实际路径 (2026-08-14 对齐)

sync_policy:
  version: "1.2"
  enabled: true
  interval_seconds: 60          # watch 轮询间隔
  conflict: "mtime_newer_wins"  # 冲突策略: 时间戳优先 (mtime 新者胜)

  # 数据源 (只读)
  sources:
    aionui_db: "C:/Users/ivy/AppData/Roaming/AionUi/aionui/aionui-backend.db"
    hermes_db: "C:/Users/ivy/AppData/Local/hermes/state.db"
    hermes_memories: "C:/Users/ivy/AppData/Local/hermes/memories"
    dsh_storages: "C:/Users/ivy/.dsh/storages"
    project_root: "C:/Users/ivy/AppData/Roaming/AionUi/aionui/conversations/2026/07/27/aionrs-temp-48324704/bottlesumo_pi"

  # 对话历史同步 (AionUi conversations/messages → Hermes aionui-archive + DSH)
  conversations:
    enabled: true
    target_hermes_dir: "aionui-archive"      # 相对 hermes_memories
    target_dsh_dir: "aionui-sync"            # 相对 dsh_storages
    fingerprint: "message_count|updated_at"  # 增量检测
    sample: {first_user_chars: 400, last_assistant_chars: 400}

  # 上下文摘要同步 (AionUi 会话 → Hermes MEMORY.md 索引行)
  summary:
    enabled: true
    target_memory_md: "MEMORY.md"            # 仅追加索引块, 不重写
    index_block_header: "## AionUi 同步索引"

  # 工作区文档同步 (项目文档 → 三方共享)
  documents:
    enabled: true
    watch_dirs: ["governance/sync", "governance/anchors", ".aionui/metacognition/thoughts"]
    exclude: ["*.pyc", "__pycache__", ".git", "*.bak-*"]

  # 元提示词/知识库 (双向)
  meta_prompts:
    enabled: true
    shared_dir: "governance/sync"
