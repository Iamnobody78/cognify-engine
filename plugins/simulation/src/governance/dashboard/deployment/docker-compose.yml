version: "3.9"

# Production deployment shape for the MCP Governance Dashboard.
# NOTE: local dev uses SQLite (default). Switch to PostgreSQL here by
# setting DATABASE_URL on the backend service.
#
# Usage:  docker compose up -d --build
#        (requires Docker daemon running + network pull access)

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: bottlesumo
      POSTGRES_PASSWORD: bottlesumo
      POSTGRES_DB: mcp_dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottlesumo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://bottlesumo:bottlesumo@postgres:5432/mcp_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8010"
    command: >
      sh -c "python seed.py --db-url '$$DATABASE_URL' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8010"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
